[project]
name = "meta"
version = "0.1.0"
description = "Meta Hackathon Project"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
